<div class="main-container d-flex panel">
    <app-panel-sidebar></app-panel-sidebar>
    <div class="content">
        <app-panel-navbar></app-panel-navbar>

        <div class="dashboard-content">
            <div class="main-container">
                <!-- Filter Card -->
                <div class="card mt-3">
                    <div class="card-header bg-filter text-white collapsed" data-bs-toggle="collapse" href="#card-collapse4" role="button" aria-expanded="false" aria-controls="card-collapse4">
                        <div class="card-widgets">
                            <a data-bs-toggle="collapse" href="#card-collapse4" role="button" aria-expanded="false" aria-controls="card-collapse4" class="collapsed"></a>
                        </div>
                        <h5 class="card-title mb-0">
                            <i class="bi bi-funnel"></i>
                            {{ 'Common.Filters' | translate }}
                        </h5>
                    </div>
                    <div id="card-collapse4" class="collapse">
                        <div class="card-body">
                            <div class="row filters-section">
                                <div class="form-group col-md-12 mb-2">
                                    <label class="form-label">
                                        {{ 'Report.User' | translate }}
                                    </label>
                                    <select
                                        class="form-select filter"
                                        id="ReportUserFilter"
                                        [(ngModel)]="selectedUserIdFilter"
                                        name="ReportUserFilter"
                                        [disabled]="activeUserRole == UserRole.Employee"
                                        (change)="filterChange()"
                                    >
                                        <option value="" selected>
                                            {{ 'Common.SelectOne' | translate }}
                                        </option>

                                        <option *ngFor="let user of userList" [value]="user.Id">
                                            {{ user.FullName }}
                                        </option>
                                    </select>
                                </div>

                                <div class="form-group col-md-12 mb-2">
                                    <div class="col-md-4 float-end">
                                        <button type="button" class="btn form-control btn-success" (click)="resetFilters()">
                                            <i class="bi bi-arrow-clockwise"></i>
                                            {{ 'Common.Reset' | translate }}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="card mt-4">
                    <div class="card-header">
                        <b>{{ 'Report.Report' | translate }}</b>
                    </div>
                    <div class="card-body">
                        <div class="row text-center mt-4">
                            <div class="col-md-6">
                                <div class="alert alert-info position-relative" role="alert">
                                    <h1>
                                        <span class="badge dashboard-badgde text-bg-info">
                                            {{ statistics?.ThisWeek?.TotalWorkTime || '0 saat 0 dakika' }}
                                        </span>
                                    </h1>
                                    <b>
                                        <i class="position-absolute top-0 start-100 translate-middle ri-time-line" style="font-size: 35px"></i>
                                        Bu Hafta Toplam Çalışma Süresi
                                    </b>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="alert alert-warning position-relative" role="alert">
                                    <h1>
                                        <span class="badge dashboard-badgde text-bg-warning">
                                            {{ statistics?.ThisMonth?.TotalWorkTime || '0 saat 0 dakika' }}
                                        </span>
                                    </h1>
                                    <b>
                                        <i class="position-absolute top-0 start-100 translate-middle ri-calendar-check-line" style="font-size: 35px"></i>
                                        Bu Ay Toplam Çalışma Süresi
                                    </b>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="card mt-4">
                                    <div class="card-header">
                                        <b>Bu Haftaki Giriş / Çıkış Saatleri</b>
                                    </div>
                                    <div class="card-body"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- End Main Container -->
            </div>
        </div>
    </div>
</div>
